name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config qt6-base-dev libpcap-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: etherape2026-linux
          path: build/bin/etherape2026

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile npcap.zip
          Expand-Archive npcap.zip -DestinationPath npcap
      - name: Build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DNPCAP_SDK_DIR="$(cygpath -w "$PWD/npcap")"
          cmake --build build -j"$NUMBER_OF_PROCESSORS"
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: etherape2026-windows
          path: build/bin/etherape2026.exe
