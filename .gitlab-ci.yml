# EtherApe 2026 - build and test on Linux, cross-checked on Windows.
stages:
  - build
  - test

variables:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

linux:
  stage: build
  image: fedora:latest
  before_script:
    - dnf install -y --setopt=install_weak_deps=False
        gcc-c++ cmake ninja-build pkgconf-pkg-config qt6-qtbase-devel libpcap-devel
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
    - ctest --test-dir build --output-on-failure
  artifacts:
    when: always
    paths:
      - build/bin/etherape2026

# MSYS2/UCRT64 toolchain, mirroring the documented Windows procedure.
windows:
  stage: build
  image: msys2/msys2-ci-base:latest
  variables:
    MSYSTEM: UCRT64
  before_script:
    - pacman -S --noconfirm --needed
        mingw-w64-ucrt-x86_64-gcc
        mingw-w64-ucrt-x86_64-qt6-base
        mingw-w64-ucrt-x86_64-cmake
        mingw-w64-ucrt-x86_64-ninja
    - export PATH=/ucrt64/bin:$PATH
  script:
    - curl -sL -o npcap.zip https://npcap.com/dist/npcap-sdk-1.16.zip
    - unzip -q npcap.zip -d /tmp/npcap
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DNPCAP_SDK_DIR="$(cygpath -w /tmp/npcap)"
    - cmake --build build
    - ctest --test-dir build --output-on-failure
  artifacts:
    when: always
    paths:
      - build/bin/etherape2026.exe
  allow_failure: true
